<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Video Downloader</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="panel-container">
    <div class="glass-card library-container">
      <div class="library-header">
        <h2>Detected Videos</h2>
      </div>

      <div id="empty-state" class="empty-state animate-fade-in">
        <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="opacity: 0.5;">
          <polygon points="23 7 16 12 23 17 23 7"></polygon>
          <rect x="1" y="5" width="15" height="14" rx="2" ry="2"></rect>
        </svg>
        <p>No videos detected yet. Play a video on the page to capture it.</p>
      </div>

      <div id="video-list" class="library-list">
        <!-- Items will be injected here -->
      </div>
    </div>
  </div>

  <script src="sidebar.js"></script>
</body>
</html>
